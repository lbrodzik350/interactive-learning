<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The History of Instructional Technology</title>
  <style>
    body { margin: 0; font: 1rem/1.6 system-ui, sans-serif; color: #182c40; background: #f1f5f8; }
    #load-error { max-width: 48rem; margin: 3rem auto; padding: 1.5rem; background: white; border: 1px solid #c1cdd7; border-radius: 12px; }
    .history-figure { margin: 1.5rem auto; max-width: 52rem; }
    .history-figure img { display: block; max-width: 100%; max-height: 34rem; height: auto; margin: 0 auto; object-fit: contain; }
    .history-figure figcaption { margin-top: .5rem; color: #42566a; font-size: .95rem; }
  </style>
</head>
<body>
  <main id="load-error" role="status">Loading the lesson and its historical images…</main>
  <script>
    (async () => {
      const source = 'https://raw.githubusercontent.com/lbrodzik350/interactive-learning/0939319f4ef30b5bbcbdb87900c72268f21a5d96/history_of_instructional_technology.html';
      try {
        const response = await fetch(source);
        if (!response.ok) throw new Error(`Lesson request failed (${response.status})`);
        const lesson = new DOMParser().parseFromString(await response.text(), 'text/html');
        const figures = [
          {
            heading: 'Hornbooks and printed materials',
            src: 'hornbook_largephoto.jpg',
            alt: 'A historical hornbook used to teach children basic reading.',
            caption: 'A hornbook: an early printed learning aid used to teach reading.'
          },
          {
            heading: 'The magic lantern',
            src: 'magic%20lantern.jpg',
            alt: 'A magic lantern, an early projection device for displaying images.',
            caption: 'Magic lanterns projected images from glass slides for classroom instruction.'
          },
          {
            heading: 'The systems approach and ADDIE',
            src: 'ADDIE-Model.png',
            alt: 'Diagram of the ADDIE instructional design model.',
            caption: 'The ADDIE framework: Analysis, Design, Development, Implementation, and Evaluation.'
          },
          {
            heading: 'The Computer Revolution: 1960s–1980s',
            src: 'Homer_E_Newell_NASA.jpg',
            alt: 'Homer E. Newell of NASA.',
            caption: 'Homer E. Newell, whose NASA and computer-science work reflects the era of expanding educational computing.'
          }
        ];
        for (const item of figures) {
          const heading = [...lesson.querySelectorAll('h2, h3')].find(el => el.textContent.trim().replace(/\s+/g, ' ') === item.heading);
          if (!heading) continue;
          const figure = lesson.createElement('figure');
          figure.className = 'history-figure';
          const image = lesson.createElement('img');
          image.src = item.src;
          image.alt = item.alt;
          image.loading = 'lazy';
          const caption = lesson.createElement('figcaption');
          caption.textContent = item.caption;
          figure.append(image, caption);
          const followingParagraph = heading.parentElement?.querySelector('p');
          (followingParagraph || heading).after(figure);
        }
        document.open();
        document.write('<!doctype html>\n' + lesson.documentElement.outerHTML);
        document.close();
      } catch (error) {
        document.getElementById('load-error').textContent = 'The lesson could not be loaded. Please check your connection and try again.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
